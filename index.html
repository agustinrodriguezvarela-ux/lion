<title>Choir Book</title>
<style>
html{background:#17161a}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#17161a;color:#ecebe6;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
.card{width:100%;max-width:380px;background:#26252a;border:1px solid #34323a;border-radius:16px;padding:26px 22px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 16px;color:#9c9a93;font-size:14px}
input[type=password],input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid #34323a;background:#17161a;color:#ecebe6}
label.r{display:flex;align-items:center;gap:8px;margin:14px 0;color:#9c9a93;font-size:14px}
button{width:100%;font:inherit;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:999px;background:#e0a35c;color:#1d1d1b;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin:12px 0 0;color:#e58a7a;font-size:14px}
</style></head><body>
<div class="card"><h1>Choir Book</h1><p>Enter the password to open.</p>
<form id="f" autocomplete="on"><input type="text" name="username" value="choir-book" autocomplete="username" hidden>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>

<script>
(function(){
  var holder=document.getElementById('d'), salt64=holder.getAttribute('data-salt'), iter=parseInt(holder.getAttribute('data-iter'),10);
  var msg=document.getElementById('msg'), go=document.getElementById('go'), pw=document.getElementById('pw');
  function b64(s){
    var pad=s.endsWith('==')?2:(s.endsWith('=')?1:0), out=new Uint8Array(s.length/4*3-pad), pos=0, CH=1048576;
    for(var i=0;i<s.length;i+=CH){var bin=atob(s.substr(i,CH)); for(var j=0;j<bin.length;j++){out[pos++]=bin.charCodeAt(j);}}
    return out;
  }
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
  function open_(password, remember, silent){
    msg.textContent=''; go.disabled=true; go.textContent='Opening...';
    if(!(window.crypto&&crypto.subtle)){msg.textContent='This browser cannot decrypt here (it needs a secure https page).'; go.disabled=false; go.textContent='Open'; return;}
    var enc=new TextEncoder(), theKey=null;
    return crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey'])
    .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt64),iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);})
    .then(function(key){
      theKey=key;
      var all=b64(holder.textContent.trim());
      return crypto.subtle.decrypt({name:'AES-GCM',iv:all.subarray(0,12)},key,all.subarray(12));
    })
    .then(function(buf){
      if(remember) lsSet('tb-pw',password); else lsDel('tb-pw');
      window.__tbKey=theKey;
      var html=new TextDecoder('utf-8').decode(buf);
      document.open(); document.write(html); document.close();
    })
    .catch(function(){
      lsDel('tb-pw'); go.disabled=false; go.textContent='Open';
      msg.textContent=silent?'':'Wrong password. Try again.'; pw.value=''; pw.focus();
    });
  }
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault(); if(!pw.value) return; open_(pw.value, document.getElementById('rem').checked, false);
  });
  var saved=lsGet('tb-pw'); if(saved){open_(saved,true,true);}
})();
</script></body></html>
